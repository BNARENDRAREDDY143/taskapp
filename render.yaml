services:
  # ─────────────────────────────────────────
  # 1. Backend — Express / Node.js Web Service
  # ─────────────────────────────────────────
  - type: web
    name: taskapp-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false        # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # Set this manually in Render dashboard
      - key: JWT_EXPIRES_IN
        value: 7d
    healthCheckPath: /api/health

  # ─────────────────────────────────────────
  # 2. Frontend — React/Vite Static Site
  # ─────────────────────────────────────────
  - type: web
    name: taskapp-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false        # Set to your backend Render URL e.g. https://taskapp-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
